<style>
/* GALERI 4 FOTO */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    width: 100%;
    max-width: 700px;
    margin: 25px auto;
    padding: 0 15px;
    box-sizing: border-box;
}

.gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    aspect-ratio: 1 / 1;
    cursor: pointer;
    background: #1c1510;
    box-shadow: 0 8px 25px rgba(0,0,0,0.35);
}

.gallery-item img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
}

/* Efek zoom saat disentuh */
.gallery-item.zoomed img {
    transform: scale(1.15);
}

/* Efek saat mouse diarahkan */
@media (hover: hover) {
    .gallery-item:hover img {
        transform: scale(1.08);
    }
}

/* HP */
@media (max-width: 480px) {
    .gallery-grid {
        gap: 10px;
        padding: 0 10px;
    }

    .gallery-item {
        border-radius: 11px;
    }
}
</style>
